services:
  - type: web
    name: tabellone-tc-salemi
    runtime: docker
    plan: starter          # serve un piano a pagamento: il disco permanente non esiste nel piano gratuito
    region: frankfurt      # server in Europa
    healthCheckPath: /healthz
    envVars:
      - key: TORNEO_PASSWORD
        sync: false        # Render ti chiede di scriverla durante la creazione
      - key: TORNEO_USER
        value: tcsalemi
      - key: TORNEO_DATA
        value: /data
      - key: TZ
        value: Europe/Rome
    disk:
      name: dati-torneo
      mountPath: /data
      sizeGB: 1
