<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabellone Torneo - Tenniscall</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px;">
    <div class="container">
        <h1>Gestione Tabellone Torneo</h1>

        <!-- Sezione Azioni: Tasto Unico -->
        <div class="actions-bar" style="margin-bottom: 20px;">
            <button id="btn-import-tenniscall" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
                Importa da Tenniscall
            </button>
            <span id="loading-spinner" style="display: none; margin-left: 10px;">⏳ Importazione ed elaborazione in corso...</span>
        </div>

        <!-- Tabella Giocatori -->
        <div class="table-container">
            <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background-color: #f4f4f4;">
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Tessera FITP</th>
                        <th>Classifica</th>
                        <th>Circolo</th>
                    </tr>
                </thead>
                <tbody id="tbody-giocatori">
                    <!-- Popolato dinamicamente da JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnImport = document.getElementById('btn-import-tenniscall');
            const spinner = document.getElementById('loading-spinner');

            caricaGiocatori();

            btnImport.addEventListener('click', async () => {
                btnImport.disabled = true;
                spinner.style.display = 'inline-block';

                try {
                    const response = await fetch('/api/import-tenniscall', { method: 'POST' });
                    const data = await response.json();

                    if (response.ok && data.success) {
                        alert(data.message);
                        caricaGiocatori();
                    } else {
                        alert('Errore importazione: ' + (data.error || data.message || 'Errore sconosciuto'));
                    }
                } catch (err) {
                    console.error('Errore rete:', err);
                    alert('Impossibile contattare il server Render.');
                } finally {
                    btnImport.disabled = false;
                    spinner.style.display = 'none';
                }
            });

            async function caricaGiocatori() {
                try {
                    const res = await fetch('/api/giocatori');
                    if (res.ok) {
                        const giocatori = await res.json();
                        renderTabella(giocatori);
                    }
                } catch (e) {
                    console.error('Errore nel recupero dei giocatori:', e);
                }
            }

            function renderTabella(lista) {
                const tbody = document.getElementById('tbody-giocatori');
                tbody.innerHTML = '';

                if (!lista || lista.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nessun giocatore presente. Clicca su "Importa da Tenniscall".</td></tr>';
                    return;
                }

                lista.forEach(g => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${g.nome || ''}</td>
                        <td>${g.cognome || ''}</td>
                        <td>${g.tessera || ''}</td>
                        <td>${g.classifica || ''}</td>
                        <td>${g.circolo || ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });
    </script>
</body>
</html>
