<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo Molto Sociale</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1c2420;--mut:#6b756f;--line:#d5dbd8;--acc:#1f6b45;--acc2:#e8f3ec;--warn:#b45309;--win:#d6efd9}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#1c2420;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header img#logo{height:36px;background:#fff;border-radius:8px;padding:3px}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
nav{display:flex;gap:4px;flex:1}
nav button{white-space:nowrap;background:transparent;color:#cfd8d3;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
nav button.on{background:var(--acc);color:#fff}
nav button:hover:not(.on){background:#2d3833}
.right{display:flex;gap:8px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}
button.b:hover{filter:brightness(1.1)}
button.g{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px}
button.g:hover{background:#f0f3f1}
button.r{background:#fff;color:#a32020;border:1px solid #e3b5b5;border-radius:6px;padding:7px 12px;cursor:pointer}
main{padding:16px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mut)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--acc2);color:var(--acc)}
.tag.w{background:#fdf0dc;color:var(--warn)}
.tag.warn{background:#fdf0dc;color:var(--warn)}
.tag.err{background:#fde8e8;color:#a32020}
.tag.info{background:#e8eef8;color:#1d4f9c}
.tag.nc{background:#e8eef8;color:#1d4f9c}
input.cl.nc{border-color:#b7c9e8;color:#1d4f9c;font-weight:600;background:#f3f7fc}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid #eceeed;text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.4px;background:#fafbfa}
tr.off td{opacity:.45}
input[type=text],select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff}
input.cl{width:70px}
.bracket{display:flex;gap:26px;overflow:auto;padding:6px 4px 14px;align-items:stretch;min-height:300px}
.round{display:flex;flex-direction:column;min-width:240px}
.round h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.matches{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.match{border:1px solid var(--line);border-radius:8px;background:#fff;margin:5px 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pl{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;cursor:pointer;border-bottom:1px solid #f0f2f1}
.pl:last-of-type{border-bottom:0}
.pl:hover{background:#f4f8f5}
.pl.win{background:var(--win);font-weight:600}
.pl.lose{color:#98a29c}
.pl.tbd,.pl.bye{cursor:default;color:#9aa49e;font-style:italic}
.pl.swap{cursor:pointer}
.pl.swap:hover{background:#fff6dc}
.tbtn{display:inline-block;margin-left:6px;min-width:20px;text-align:center;font-size:11px;font-weight:700;border:1px solid #c9a227;color:#8a6d00;background:#fff8d6;border-radius:4px;cursor:pointer;padding:0 4px}
.tbtn.ebtn{border-color:#3b7dd8;color:#1d4f9c;background:#e8f1ff}
.tbtn.ebtn:hover{background:#c9defc}
.tbtn:hover{background:#ffe27a}
.pl.sel{background:#ffd966!important;font-weight:600}
.editbar{background:#fff6dc;border:1px solid #e6cf7d;border-radius:8px;padding:8px 12px;margin-bottom:10px}
.pl .rk{color:var(--mut);font-size:12px;font-weight:400}
.pl .sd{display:inline-block;min-width:18px;font-size:11px;background:#1c2420;color:#fff;border-radius:4px;text-align:center;margin-right:5px}
.sc{border-top:1px dashed var(--line);padding:3px 6px;background:#fafbfa}
.sc input{width:100%;border:0;background:transparent;font-size:12px;padding:3px 2px;outline:none}
.champ{margin-top:10px;padding:14px 18px;border-radius:10px;background:linear-gradient(90deg,#f6e7b0,#fff3cf);border:1px solid #e6cf7d;font-size:17px;font-weight:600}
.hero{display:flex;align-items:center;gap:22px;padding:12px 18px}
.hero img{height:78px;max-width:60%;object-fit:contain}
.hero .ht{font-size:22px;font-weight:600}
.ovl{position:fixed;inset:0;background:rgba(20,28,24,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:#fff;border-radius:12px;padding:20px 22px;width:min(460px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.dlg input{width:100%}
.tcmsg{font-size:13px;color:#a32020;white-space:pre-wrap}
.tcmsg.ok{color:var(--acc)}
.tcmsg details{color:#555;margin-top:6px}
.bar{height:10px;background:#e3e8e5;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.hint{font-size:13px;color:var(--mut);margin:4px 0 0}
.toast{position:fixed;right:18px;bottom:18px;background:#1c2420;color:#fff;padding:11px 16px;border-radius:8px;max-width:520px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.err{background:#a32020}
h2{margin:0 0 8px;font-size:16px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.f input{font-size:14px;color:var(--ink)}

nav button .ic{display:none;font-size:18px;line-height:1}
nav button .ls{display:none}
#pdfAll .sm{display:none}
input[type=checkbox]{width:18px;height:18px}
@media (max-width:760px){
  body{font-size:15px;-webkit-text-size-adjust:100%}
  header{padding:8px 12px;gap:8px;position:static;flex-wrap:nowrap}
  header img#logo{height:30px;padding:2px}
  header h1{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .right{gap:6px}
  .right button{padding:8px 12px;font-size:13px;white-space:nowrap}
  #pdfAll .lg{display:none}
  #pdfAll .sm{display:inline}
  #quit{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1c2420;gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));border-top:1px solid #33403a;flex:none;justify-content:space-around}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;font-size:10.5px;border-radius:8px;min-width:0;white-space:nowrap}
  nav button .ic{display:block}
  nav button .ll{display:none}
  nav button .ls{display:inline}
  main{padding:10px 10px calc(84px + env(safe-area-inset-bottom))}
  .card{padding:12px;border-radius:10px;margin-bottom:10px}
  h2{font-size:16px}
  .toast{left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:none;font-size:14px}
  input[type=text],input[type=password],select{font-size:16px;padding:9px 10px;max-width:100%}
  input.cl{width:100%}
  button.b,button.g,button.r{padding:10px 14px;font-size:14px}
  .row{gap:8px}
  .row>.b,.row>.g{flex:1 1 auto}
  .row input[type=text]{flex:1 1 100%}
  .hero{display:none}
  .hero img{height:48px;max-width:42%}
  .hero .ht{font-size:17px}
  /* elenchi: da tabella a schede */
  .card[style*="overflow:auto"]{padding:0;overflow:visible!important}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px 10px;padding:10px 12px;border-bottom:1px solid #e3e8e5;align-items:start}
  tbody td{border:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0;word-break:break-word}
  tbody td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  tbody td[data-label=""]::before{display:none}
  tbody td:empty{display:none}
  tbody td[data-label="Cognome"],tbody td[data-label="Nome"]{font-weight:600}
  tbody td[data-label="Cognome"]::before,tbody td[data-label="Nome"]::before,tbody td:first-child::before,tbody td:last-child::before{display:none}
  tbody td button{padding:8px 12px}
  tbody td .tag{align-self:flex-start}
  /* Iscritti */
  #tb td:nth-child(1){grid-area:1/1;align-self:center}
  #tb td:nth-child(2){grid-area:1/2}
  #tb td:nth-child(3){grid-area:1/3}
  #tb td:nth-child(9){grid-area:1/4}
  #tb td:nth-child(4){grid-area:2/1/3/3}
  #tb td:nth-child(5){grid-area:2/3/3/5}
  #tb td:nth-child(6){display:none}
  #tb td:nth-child(7){display:none}
  #tb td:nth-child(8){grid-area:3/1/4/5}
  /* Classifica */
  #ctb td:nth-child(1){grid-area:1/1;align-self:center}
  #ctb td:nth-child(2){grid-area:1/2}
  #ctb td:nth-child(3){grid-area:1/3}
  #ctb td:nth-child(11){grid-area:1/4}
  #ctb td:nth-child(5){grid-area:2/1/3/3}
  #ctb td:nth-child(8){grid-area:2/3/3/5}
  #ctb td:nth-child(10){grid-area:3/1/4/4}
  #ctb td:nth-child(9){grid-area:3/4}
  #ctb td:nth-child(4),#ctb td:nth-child(6),#ctb td:nth-child(7){display:none}
  input[type=checkbox]{width:24px;height:24px}
  /* tabellone: un turno alla volta, scorrimento orizzontale */
  .bracket{gap:12px;scroll-snap-type:x proximity;padding:4px 2px 12px;margin:0 -2px;-webkit-overflow-scrolling:touch}
  .round{min-width:84vw;scroll-snap-align:start}
  .pl{padding:11px 12px;font-size:15px}
  .sc input{font-size:16px;padding:9px 4px}
  .tbtn{min-width:34px;padding:6px 8px;font-size:14px;margin-left:8px}
  .editbar{font-size:13px}
  .champ{font-size:15px;padding:12px 14px}
  .dlg{width:94vw;padding:16px}
  .ovl{align-items:flex-start;padding-top:8vh}
}
</style>
</head>
<body>
<header>
  <img id="logo" src="/logo.png" alt="" onerror="this.style.display='none'">
  <h1 id="ttl">Torneo Sociale TC Salemi</h1>
  <nav id="nav">
    <button data-tab="iscritti"><span class="ic">&#128101;</span><span>Iscritti</span></button>
    <button data-tab="class"><span class="ic">&#128200;</span><span>Classifica</span></button>
    <button data-tab="M"><span class="ic">&#9794;</span><span class="ll">Singolare maschile</span><span class="ls">Maschile</span></button>
    <button data-tab="F"><span class="ic">&#9792;</span><span class="ll">Singolare femminile</span><span class="ls">Femminile</span></button>
    <button data-tab="imp"><span class="ic">&#9881;</span><span class="ll">Impostazioni</span><span class="ls">Impost.</span></button>
    <button data-tab="help"><span class="ic">&#10067;</span><span>Guida</span></button>
  </nav>
</header>
<main id="main"></main>
<script>
"use strict";
let S = null, tab = "iscritti", filterText = "", editMode = false, swapSel = null;

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, err) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3500);
}

async function call(path, body, isForm) {
  try {
    const opt = body === undefined ? {} : { method: "POST", body: isForm ? body : JSON.stringify(body) };
    const r = await fetch(path, opt);
    const j = await r.json();
    if (!r.ok) { toast(j.error || "Errore", true); return null; }
    return j;
  } catch (e) { toast("Errore di comunicazione con il programma", true); return null; }
}

async function act(path, body) {
  const j = await call(path, body);
  if (j && j.players) { S = j; }
  return j;
}

const byId = () => { const m = {}; S.players.forEach(p => m[p.id] = p); return m; };
const fullName = p => (p.cognome + " " + p.nome).trim();

function counts() {
  const c = { M: 0, F: 0 };
  S.players.forEach(p => { if (p.iscritto) c[p.sesso] = (c[p.sesso] || 0) + 1; });
  return c;
}

function render() {
  if (S) { S.players = S.players || []; S.draws = S.draws || {}; }
  if (S.serverMode) { const q = $("#quit"); if (q) q.style.display = "none"; }
  $("#ttl").textContent = S.title || "Torneo Sociale";
  document.title = S.title || "Torneo Sociale";
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const sc = { x: 0, y: 0 };
  const br = $(".bracket"); if (br) { sc.x = br.scrollLeft; sc.y = br.scrollTop; }
  if (tab === "iscritti") renderIscritti();
  else if (tab === "imp") renderImp();
  else if (tab === "help") renderHelp();
  else if (tab === "class") renderClassifica();
  else renderDraw(tab);
  const br2 = $(".bracket"); if (br2) { br2.scrollLeft = sc.x; br2.scrollTop = sc.y; }
}

/* ---------------- ISCRITTI ---------------- */
function renderIscritti() {
  const list = S.players.slice().sort((a, b) => fullName(a).localeCompare(fullName(b), "it"));
  const rows = list.map(p => `
    <tr data-id="${p.id}" class="${p.iscritto ? "" : "off"}">
      <td data-label="Gioca"><input type="checkbox" class="isc" ${p.iscritto ? "checked" : ""}></td>
      <td data-label="Cognome">${esc(p.cognome)}</td><td data-label="Nome">${esc(p.nome)}</td>
      <td data-label="Sesso"><select class="sx"><option value="M" ${p.sesso === "M" ? "selected" : ""}>M</option><option value="F" ${p.sesso === "F" ? "selected" : ""}>F</option></select></td>
      <td data-label="Classifica"><input type="text" class="cl${isNC(p.classifica) ? " nc" : ""}" value="${esc(p.classifica)}"></td>
      <td data-label="Cat.">${esc(p.categoria)}</td><td data-label="Prov.">${esc(p.provincia)}</td>
      <td data-label="Controllo" class="full">${warnTag(p)}</td>
      <td data-label="" class="full"><button class="r del" title="Elimina dall'elenco">&times;</button></td>
    </tr>`).join("");
  $("#main").innerHTML = `
    <div class="card hero">
      <img src="/logo.png" alt="" onerror="this.style.display='none'">
      <div><div class="ht">${esc(S.title || "Torneo Sociale")}</div><div class="muted">${esc([S.luogo, S.date].filter(Boolean).join(" - "))}</div></div>
    </div>
    <div class="card">
      <div class="row">
        <h2 style="margin:0">Iscritti al torneo</h2>
        <span class="tag" id="cM"></span><span class="tag" id="cF"></span>
        <span style="flex:1"></span>
        <input type="text" id="flt" placeholder="Cerca giocatore..." value="${esc(filterText)}">
        <button class="g" id="addp">+ Aggiungi giocatore</button>
      </div>
      <div class="row" style="margin-top:10px;padding:10px 12px;background:#f1f6f3;border-radius:8px;flex-wrap:wrap;gap:8px">
        <b>Elenco da TennisCall:</b>
        <button class="b" id="tcGo">Importa CSV TennisCall</button>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" style="display:none">
        <span class="muted">Apre il selettore file: scegli il CSV da Download.</span>
      </div>
      <p class="hint">Togli la spunta a chi non partecipa. Il <b>sesso &egrave; stimato dal nome</b>: controllalo e correggilo se serve. La classifica pu&ograve; essere modificata a mano (4.1 &egrave; la pi&ugrave; forte, 4.NC la pi&ugrave; debole).</p>
      <div id="addbox" style="display:none;margin-top:10px" class="row">
        <label class="f">Nome<input type="text" id="an"></label>
        <label class="f">Cognome<input type="text" id="ac"></label>
        <label class="f">Classifica<input type="text" id="ak" class="cl" placeholder="4.NC"></label>
        <label class="f">Sesso<select id="as"><option value="">auto</option><option>M</option><option>F</option></select></label>
        <button class="b" id="addok" style="align-self:flex-end">Aggiungi</button>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Gioca</th><th>Cognome</th><th>Nome</th><th>Sesso</th><th>Classifica</th><th>Cat.</th><th>Prov.</th><th>Controllo</th><th></th></tr></thead>
      <tbody id="tb">${rows}</tbody></table>
    </div>`;
  updateCounts(); applyFilter();
  $("#flt").oninput = e => { filterText = e.target.value; applyFilter(); };
  $("#addp").onclick = () => { const b = $("#addbox"); b.style.display = b.style.display === "none" ? "flex" : "none"; };
  $("#addok").onclick = async () => {
    const j = await act("/api/player/add", { nome: $("#an").value, cognome: $("#ac").value, classifica: $("#ak").value, sesso: $("#as").value });
    if (j) { toast("Giocatore aggiunto"); render(); }
  };
  $("#tcGo").onclick = () => {
    const inp = $("#csvFile");
    if (inp) { inp.value = ""; inp.click(); }
  };
  $("#csvFile").onchange = async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    await importCsvFile(f);
  };
  $("#tb").onchange = async e => {
    const tr = e.target.closest("tr"); if (!tr) return;
    const id = +tr.dataset.id; let body = { id };
    if (e.target.classList.contains("isc")) { body.iscritto = e.target.checked; tr.classList.toggle("off", !e.target.checked); }
    else if (e.target.classList.contains("sx")) body.sesso = e.target.value;
    else if (e.target.classList.contains("cl")) body.classifica = e.target.value;
    else return;
    const j = await act("/api/player", body);
    if (j) { updateCounts(); const p = S.players.find(x => x.id === id); const w = tr.children[7]; if (w && p) w.innerHTML = warnTag(p); }
  };
  $("#tb").onclick = async e => {
    if (!e.target.classList.contains("del")) return;
    const tr = e.target.closest("tr"); const p = S.players.find(x => x.id === +tr.dataset.id);
    if (!confirm("Eliminare " + fullName(p) + " dall'elenco?")) return;
    const j = await act("/api/player/delete", { id: p.id });
    if (j) render();
  };
}
function isNC(c) {
  return /^4\s*[.,]?\s*nc$/i.test(String(c || "").trim());
}
function warnTag(p) {
  const t = [];
  if (p.esito === "NON AGONISTA") t.push('<span class="tag info" title="' + esc(p.note) + '">non agonista</span>');
  if (p.esito === "DA VERIFICARE") t.push('<span class="tag warn" title="' + esc(p.note) + '">da verificare</span>');
  if (p.esito === "DA AGGIORNARE") t.push('<span class="tag info" title="' + esc(p.note) + '">da aggiornare</span>');
  if (p.esito === "NOME MODIFICATO") t.push('<span class="tag info" title="' + esc(p.note) + '">nome modificato</span>');
  if (p.esito && p.esito.indexOf("ERRORE") >= 0) t.push('<span class="tag err" title="' + esc(p.note) + '">errore rete</span>');
  if (!String(p.classifica).trim()) t.push('<span class="tag warn">classifica mancante</span>');
  else if (isNC(p.classifica) && p.esito !== "NON AGONISTA") t.push('<span class="tag nc" title="Classifica 4.NC">4.NC</span>');
  return t.join(" ");
}
function updateCounts() {
  const c = counts();
  if ($("#cM")) { $("#cM").textContent = "Uomini iscritti: " + (c.M || 0); $("#cF").textContent = "Donne iscritte: " + (c.F || 0); }
}
function applyFilter() {
  const q = filterText.trim().toLowerCase();
  document.querySelectorAll("#tb tr").forEach(tr => {
    tr.style.display = !q || tr.textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
  });
}

/* ---------------- TABELLONE ---------------- */
const roundNames = n => ({2:"Finale",4:"Semifinali",8:"Quarti di finale",16:"Ottavi di finale",32:"Sedicesimi",64:"Trentaduesimi"}[n] || ("Turno da " + n));
const sexName = s => s === "M" ? "maschile" : "femminile";

function defaultSeeds(n) { let size = 2; while (size < n) size *= 2; return size >= 32 ? 8 : size >= 16 ? 4 : size >= 8 ? 2 : 0; }

function renderDraw(sex) {
  const d = S.draws && S.draws[sex];
  const n = counts()[sex] || 0;
  const pl = byId();
  let html = `<div class="card"><div class="row"><h2 style="margin:0">Singolare ${sexName(sex)}</h2><span class="tag">Iscritti: ${n}</span>`;
  if (!d) {
    const ds = defaultSeeds(n);
    html += `<span style="flex:1"></span>

      <select id="seeds">${[0,2,4,8].map(k => `<option value="${k}" ${k === ds ? "selected" : ""}>${k}</option>`).join("")}</select></label>
      <button class="b" id="doDraw">Sorteggia il tabellone</button></div>

    };
    return;
  }
  html += `<span class="muted">Sorteggio del ${esc(d.created)}</span><span style="flex:1"></span>
    <button class="g" id="pdfOne">Esporta PDF di questo tabellone</button>
    <button class="${editMode ? "b" : "g"}" id="editB">${editMode ? "Fine modifica" : "Modifica sorteggio"}</button>
    <button class="g" id="redo">Rifai il sorteggio</button>
    <button class="r" id="delDraw">Elimina tabellone</button></div>
    <p class="hint">Clicca sul nome del vincitore di ogni partita e scrivi il punteggio (es. <i>6-4 6-3</i>). Per togliere il vincitore clicca di nuovo sul suo nome. Se modifichi un risultato, quelli dei turni successivi che dipendono da lui vengono azzerati.</p></div>`;
  if (editMode) html += '<div class="editbar"><b>Modifica sorteggio:</b> clicca un giocatore (o un BYE) nel primo turno e poi un altro per scambiarli di posto: cos&igrave; puoi spostare le teste di serie dove vuoi. Il pulsante <b>T</b> accanto al nome serve a dare, cambiare o togliere il numero di testa di serie; il pulsante <b>&#10548;</b> serve a far entrare il giocatore a un <b>turno diverso dal primo</b> (ottavi, quarti, ecc.). Se ci sono gi&agrave; risultati, quelli delle partite coinvolte vengono azzerati (con conferma).</div>';
  html += '<div class="bracket">';
  d.rounds.forEach((rd, r) => {
    html += `<div class="round"><h4>${roundNames(d.size >> r)}</h4><div class="matches">`;
    rd.forEach((m, i) => { html += matchHtml(m, r, i, pl, d); });
    html += "</div></div>";
  });
  html += "</div>";
  const fin = d.rounds[d.rounds.length - 1][0];
  if (fin.w > 0 && pl[fin.w]) html += `<div class="champ">&#127942; Vincitore del singolare ${sexName(sex)}: ${esc(fullName(pl[fin.w]))}</div>`;
  $("#main").innerHTML = html;
  $("#pdfOne").onclick = () => savePdf(sex);
  $("#editB").onclick = () => { editMode = !editMode; swapSel = null; render(); };
  $("#redo").onclick = async () => {
    if (!confirm("Rifare il sorteggio cancella il tabellone e tutti i risultati inseriti. Continuare?")) return;
    const j = await act("/api/draw", { sex, seeds: defaultSeeds(n) });
    if (j) { toast("Nuovo sorteggio fatto"); render(); }
  };
  $("#delDraw").onclick = async () => {

  };
  document.querySelectorAll(".ebtn").forEach(el => el.onclick = async e => {

    const cur = entryRound(d, id) + 1;
    const list = d.rounds.map((_, r) => (r + 1) + " = " + roundNames(d.size >> r)).join("\n");
    const v = prompt("A quale turno deve entrare " + fullName(pl[id]) + "?\n(ora entra al turno " + cur + ")\n\n" + list + "\n\nScrivi il numero del turno:", cur);
    if (v === null) return;

    if (!R) return;
    await doEnter(sex, id, R, false);
  });
  document.querySelectorAll(".tbtn:not(.ebtn)").forEach(el => el.onclick = async e => {
    e.stopPropagation();

    render();
  });
  document.querySelectorAll(".pl[data-slot]").forEach(el => el.onclick = async () => {
    const k = +el.dataset.slot;
    if (swapSel === null) { swapSel = k; render(); return; }
    if (swapSel === k) { swapSel = null; render(); return; }
    const a = swapSel; swapSel = null;
    const n = resultsInPaths(d, a, k);
    if (n > 0 && !confirm("Questo scambio azzera " + n + " risultat" + (n === 1 ? "o" : "i") + " gia' inserit" + (n === 1 ? "o" : "i") + " (solo delle partite coinvolte). Continuare?")) { render(); return; }
    const j = await act("/api/swap", { sex, a, b: k, confirm: n > 0 });
    if (j) toast("Posizioni scambiate");
    render();
  });
  if (!editMode) document.querySelectorAll(".pl[data-id]").forEach(el => el.onclick = async () => {
    const id = +el.dataset.id, r = +el.dataset.r, mi = +el.dataset.m;

  });
  document.querySelectorAll(".sc input").forEach(el => el.onchange = async () => {
    const j = await act("/api/result", { sex, round: +el.dataset.r, match: +el.dataset.m, score: el.value });
    if (j) toast("Risultato salvato");
  });
}

function entryRound(d, id) {
  let s = -1;
  d.rounds[0].forEach((m, i) => { if (m.a === id) s = 2 * i; if (m.b === id) s = 2 * i + 1; });
  if (s < 0) return 0;
  for (let r = 0; r < d.rounds.length; r++) {
    const m = d.rounds[r][(s >> 1) >> r];
    if (m.a !== -1 && m.b !== -1) return r;
  }
  return d.rounds.length - 1;
}

async function doEnter(sex, id, R, confirmed) {
  let r, j;
  try {
    r = await fetch("/api/enter", { method: "POST", body: JSON.stringify({ sex, id, round: R, confirm: confirmed }) });
    j = await r.json();
  } catch (e) { toast("Errore di comunicazione con il programma", true); return; }
  if (r.status === 409 && j.needConfirm) {
    if (confirm("L'operazione azzera " + j.count + " risultati gia' inseriti (solo delle partite coinvolte). Continuare?")) return doEnter(sex, id, R, true);
    return;
  }
  if (!r.ok) { toast(j.error || "Errore", true); return; }
  S = j; toast(j.message || "Fatto"); render();
}

async function importCsvFile(f) {
  const btn = $("#tcGo");
  if (btn) { btn.disabled = true; btn.textContent = "Importazione..."; }
  try {
    const buf = await f.arrayBuffer();
    const r = await fetch("/api/import/csv", {
      method: "POST",
      headers: { "Content-Type": "text/csv" },
      body: buf
    });
    const j = await r.json();
    if (!r.ok) { toast(j.error || "Errore nell'importazione", true); return; }
    S = j; toast(j.message || "CSV importato"); render();
  } catch (err) {
    toast("Errore di comunicazione con il programma", true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Importa CSV TennisCall"; }
  }
}



function resultsInPaths(d, a, b) {
  const seen = {}; let n = 0;
  [a, b].forEach(s => d.rounds.forEach((rd, r) => {
    const i = (s >> 1) >> r, key = r + ":" + i;
    if (seen[key]) return; seen[key] = 1;
    const m = rd[i]; if (m.a > 0 && m.b > 0 && m.w > 0) n++;
  }));
  return n;
}

function plHtml(id, m, r, i, pl, d, slot) {
  const sw = editMode && r === 0 ? ` swap${swapSel === slot ? " sel" : ""}" data-slot="${slot}` : "";
  if (id === -1) return `<div class="pl bye${sw}"><span>BYE</span></div>`;
  if (id === 0 || !pl[id]) return '<div class="pl tbd"><span>da definire</span></div>';
  const p = pl[id];
  const cls = m.w === id ? "win" : (m.w > 0 ? "lose" : "");
  const sd = d.seeds && d.seeds[id] ? `<span class="sd">${d.seeds[id]}</span>` : "";
  return `<div class="pl ${cls}${sw}" data-id="${id}" data-r="${r}" data-m="${i}"><span>${sd}${esc(fullName(p))}</span><span><span class="rk">${esc(p.classifica)}</span>${editMode && r === 0 ? `<span class="tbtn" data-seedid="${id}" title="Imposta, cambia o togli il numero di testa di serie">T</span><span class="tbtn ebtn" data-enterid="${id}" title="Scegli a quale turno entra questo giocatore">&#10548;</span>` : ""}</span></div>`;
}
function matchHtml(m, r, i, pl, d) {
  const real = m.a > 0 && m.b > 0;
  return `<div class="match">${plHtml(m.a, m, r, i, pl, d, 2 * i)}${plHtml(m.b, m, r, i, pl, d, 2 * i + 1)}${
    real && !editMode ? `<div class="sc"><input type="text" placeholder="punteggio" value="${esc(m.score)}" data-r="${r}" data-m="${i}"></div>` : ""}</div>`;
}

function statoTag(p) {
  const e = p.esito || "";
  if (e === "TROVATO") return '<span class="tag" title="' + esc(p.note) + '">trovato</span>';
  if (e === "NON AGONISTA") return '<span class="tag info" title="' + esc(p.note) + '">non agonista</span>';
  if (e === "DA VERIFICARE") return '<span class="tag warn" title="' + esc(p.note) + '">da verificare</span>';
  if (e === "DA AGGIORNARE") return '<span class="tag info" title="' + esc(p.note) + '">da aggiornare</span>';
  if (e === "NOME MODIFICATO") return '<span class="tag info" title="' + esc(p.note) + '">nome modificato</span>';
  if (e.indexOf("ERRORE") >= 0) return '<span class="tag err" title="' + esc(p.note) + '">errore rete</span>';
  if (e) return '<span class="tag warn" title="' + esc(p.note) + '">' + esc(e.toLowerCase()) + '</span>';
  if (isNC(p.classifica)) return '<span class="tag nc">4.NC</span>';
  return "";
}
function varHtml(p) {

  const tip = h.slice().reverse().map(x => x.data + ": " + (x.da || "-") + " -> " + x.a + " (" + x.fonte + ")").join("\n");
  return '<span title="' + esc(tip) + '">' + esc(l.da || "-") + " &rarr; <b>" + esc(l.a) + "</b> <span class='muted'>" + esc(shortDate(l.data)) + "</span></span>";
}

async function pollOnce(resume) {
  const j = await call("/api/fitp/status");
  if (!j || tab !== "class") return;
  const prog = $("#prog");
  if (!prog) return;
  if (j.running) {
    wasRunning = true;
    prog.style.display = ""; $("#cancelUpd").style.display = ""; $("#upd").disabled = true;
    $("#barI").style.width = (j.total ? Math.round(100 * j.done / j.total) : 0) + "%";
    $("#progT").textContent = "Aggiornati " + j.done + " di " + j.total + (j.current ? " - ora: " + j.current : "");
    clearTimeout(pollT); pollT = setTimeout(() => pollOnce(), 800);
  } else {
    $("#cancelUpd").style.display = "none"; $("#upd").disabled = false;
    if (wasRunning) {
      wasRunning = false;
      const s = await call("/api/state"); if (s) S = s;
      render();
      toast(j.message ? j.message : ("Aggiornamento finito: " + j.found + " trovati, " + j.none + " non agonisti, " + j.verify + " da verificare, " + j.errors + " con errore di rete (assegnata 4.NC), " + j.changed + " classifiche cambiate" + (j.errors > 0 && j.lastError ? ". Primo errore: " + j.lastError : "")), !!j.message || j.errors > 0);
    }
  }
}
function startPoll() { wasRunning = true; clearTimeout(pollT); pollOnce(); }

      <ul>
        <li>Puoi scambiare di posto anche a risultati gi&agrave; inseriti: il programma chiede conferma e azzera solo i risultati delle partite coinvolte (quelle dei due giocatori scambiati e dei turni che le seguono). Le partite degli altri rami restano come sono.</li>
        <li>Per far entrare un giocatore a un turno successivo servono abbastanza BYE: il programma libera il suo spicchio di tabellone con dei BYE, spostando altrove i giocatori che c&rsquo;erano, e ti dice se non bastano. Se i giocatori sono quanti i posti del tabellone (nessun BYE) non si pu&ograve; saltare nessun turno.</li>
        <li>Il numero della testa di serie resta attaccato al giocatore. Se lo sposti, il suo numero lo segue e il PDF mostra la nuova posizione.</li>
        <li>La modifica viene salvata e finisce anche nel PDF.</li>
      </ul>
    </div>`;
}

  await fetch("/api/quit", { method: "POST" }).catch(() => {});
  document.body.innerHTML = '<div style="padding:40px;font-size:18px">Programma chiuso. Puoi chiudere questa finestra.</div>';
};
const ping = () => fetch("/api/ping").catch(() => {});
setInterval(ping, 5000);
window.addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/closing"); } catch (e) {} });
(async () => { await ping(); const j = await call("/api/state"); if (j) { S = j; render(); } })();
</script>
